services:
  db:
    image: postgres:16-alpine
    container_name: qadam_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB not set}
    volumes:
      - qadam_crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: qadam_crm_redis
    restart: unless-stopped
    command: >
      sh -c "redis-server
      --appendonly yes
      --requirepass \"$$REDIS_PASSWORD\"
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD not set}
    volumes:
      - qadam_crm_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: qadam_crm_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set to comma-separated allowed origins in prod}
      APP_ENV: ${APP_ENV:-production}
      UPLOAD_DIR: /app/uploads
      EXPORT_DIR: /app/exports
    volumes:
      - qadam_crm_uploads:/app/uploads
      - qadam_crm_exports:/app/exports
    expose:
      - "8000"
    command: >
      sh -c "python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  celery_worker:
    build:
      context: ./backend
    container_name: qadam_crm_celery_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      UPLOAD_DIR: /app/uploads
      EXPORT_DIR: /app/exports
    volumes:
      - qadam_crm_uploads:/app/uploads
      - qadam_crm_exports:/app/exports
    command: >
      sh -c "celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=2"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app.celery_app inspect ping -d celery@$$HOSTNAME > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  celery_beat:
    build:
      context: ./backend
    container_name: qadam_crm_celery_beat
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      UPLOAD_DIR: /app/uploads
      EXPORT_DIR: /app/exports
    volumes:
      - qadam_crm_uploads:/app/uploads
      - qadam_crm_exports:/app/exports
    command: >
      sh -c "celery -A app.core.celery_app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /
    container_name: qadam_crm_frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.28-alpine
    container_name: qadam_crm_nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      # HTTP-конфиг: работает локально и на серверах без TLS. Для реального prod с
      # Let's Encrypt подключай override: docker-compose.tls.yml (см. docs/DEPLOY.md).
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - qadam_crm_uploads:/var/www/uploads:ro

volumes:
  qadam_crm_pgdata:
  qadam_crm_uploads:
  qadam_crm_exports:
  qadam_crm_redis:
