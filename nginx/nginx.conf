user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # === Rate limit zones ===
    # На auth-эндпоинты: 10 запросов в минуту с IP (доп. слой поверх SlowAPI в backend)
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    # На весь API: 30 rps с burst
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

    # Ограничение конкурентных соединений с одного IP
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # Wildcard-хост: сюда попадает `qadam.kz`, `www.qadam.kz`, `acme.qadam.kz`,
    # а также любые IP/localhost. Слаг поддомена извлекаем в переменную и
    # прокидываем в backend через `X-Tenant-Slug` — так backend не зависит
    # от того, как парсится Host (порт, X-Forwarded-Host, и т.д.).
    map $host $tenant_slug {
        default "";
        "~^(?<sub>[a-z0-9-]+)\.qadam\.kz$" $sub;
    }

    server {
        listen 80;
        server_name _;

        # === Security headers ===
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # HSTS раскомментировать после включения HTTPS (см. блок server 443 ниже):
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        limit_conn perip 50;

        # === Auth endpoints — жёсткий rate-limit ===
        location ~ ^/api/auth/(login|refresh)$ {
            limit_req zone=auth_zone burst=5 nodelay;
            limit_req_status 429;

            set $backend_upstream http://backend:8000;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Tenant-Slug     $tenant_slug;
        }

        # === WebSocket ===
        location = /ws {
            set $backend_upstream http://backend:8000;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Tenant-Slug     $tenant_slug;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # === API ===
        location /api/ {
            limit_req zone=api_zone burst=60 nodelay;

            set $backend_upstream http://backend:8000;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Tenant-Slug     $tenant_slug;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # === Аватары/логотипы/брендинг (статика из volume, per-tenant подпапки) ===
        # /media/{tenant_id}/avatars/*, /media/{tenant_id}/branding/*, а также
        # legacy /media/avatars/* (файлы до миграции per-tenant).
        location /media/ {
            alias /var/www/uploads/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # === Файловые вложения — через backend (нужен auth-check) ===
        location /uploads/ {
            set $backend_upstream http://backend:8000;
            proxy_pass         $backend_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # === Frontend SPA (со всеми ассетами) ===
        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass         $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ===================================================================
    # HTTPS-блок — включи после того как получишь SSL-сертификат.
    # Проще всего через Let's Encrypt + certbot:
    #   1) Установи certbot на хост
    #   2) certbot certonly --webroot -w /var/www/certbot -d your-domain.example
    #   3) Смонтируй сертификаты в контейнер nginx:
    #        - /etc/letsencrypt:/etc/letsencrypt:ro
    #   4) Раскомментируй блок ниже, замени server_name, и добавь редирект 80→443
    # ===================================================================
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.example;
    #
    #     ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # ... те же location-блоки, что и в server 80 выше
    # }
}
