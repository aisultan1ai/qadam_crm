user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # === Rate limit zones ===
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # Тенант-slug извлекается из поддомена (`acme.qadam.kz` → `acme`).
    # Апекс/www/IP → пусто (default tenant).
    map $host $tenant_slug {
        default "";
        "~^(?<sub>[a-z0-9-]+)\.qadam\.kz$" $sub;
    }

    # ===================================================================
    # HTTP :80 — ACME challenge + принудительный редирект на HTTPS
    # ===================================================================
    server {
        listen 80;
        server_name qadam.kz *.qadam.kz;

        # Let's Encrypt HTTP-01 challenge (webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # Всё остальное — редирект на HTTPS.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===================================================================
    # HTTPS :443 — основной сервер
    # ===================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name qadam.kz *.qadam.kz;

        ssl_certificate     /etc/letsencrypt/live/qadam.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/qadam.kz/privkey.pem;

        # Mozilla Intermediate profile (TLS 1.2/1.3)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # === Security headers ===
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        limit_conn perip 50;

        # === Auth endpoints — жёсткий rate-limit ===
        location ~ ^/api/auth/(login|refresh)$ {
            limit_req zone=auth_zone burst=5 nodelay;
            limit_req_status 429;

            set $backend_upstream http://backend:8000;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Tenant-Slug     $tenant_slug;
        }

        # === WebSocket ===
        location = /ws {
            set $backend_upstream http://backend:8000;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Tenant-Slug     $tenant_slug;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # === API ===
        location /api/ {
            limit_req zone=api_zone burst=60 nodelay;

            set $backend_upstream http://backend:8000;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Tenant-Slug     $tenant_slug;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # === Аватары/логотипы/брендинг (статика из volume, per-tenant подпапки) ===
        location /media/ {
            alias /var/www/uploads/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # === Файловые вложения — через backend (нужен auth-check) ===
        location /uploads/ {
            set $backend_upstream http://backend:8000;
            proxy_pass         $backend_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # === Frontend SPA ===
        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass         $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
