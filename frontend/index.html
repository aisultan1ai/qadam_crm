<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 72 72'%3E%3Crect width='72' height='72' rx='18' fill='%234f46e5'/%3E%3Cpath d='M36 16a20 20 0 1 0 14.14 34.14' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M45 45 L58 58' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <title>Qadam CRM</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = stored === "dark" || (!stored && prefersDark);
          if (isDark) document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = isDark ? "#1e1e26" : "#fafafa";
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { background-color: #fafafa; }
      html.dark, html.dark body { background-color: #1e1e26; }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
