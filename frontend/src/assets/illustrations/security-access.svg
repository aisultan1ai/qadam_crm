<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 272" width="440" height="272" fill="none" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif">
  <!-- Access matrix on the graphite ground: roles × modules, with a shield. For dark backgrounds (#12151B). -->
  <rect x="0.5" y="0.5" width="419" height="259" rx="12" fill="#171A20" stroke="#232830"/>
  <text x="24" y="34" font-size="11" font-weight="600" fill="#EEF0F3">Права роли</text>
  <rect x="330" y="20" width="66" height="20" rx="5" fill="#2A52C4" fill-opacity="0.25"/>
  <text x="363" y="34" text-anchor="middle" font-size="9" font-weight="600" fill="#93AEF3">Менеджер</text>
  <rect x="0" y="52" width="420" height="1" fill="#232830"/>
  <g font-size="8" font-weight="600" letter-spacing="0.6" fill="#697180">
    <text x="190" y="72" text-anchor="middle">ПРОСМОТР</text>
    <text x="264" y="72" text-anchor="middle">СОЗДАНИЕ</text>
    <text x="344" y="72" text-anchor="middle">УДАЛЕНИЕ</text>
  </g>
  <g font-size="10" fill="#CBD0D8">
    <text x="24" y="104">Сделки</text>
    <text x="24" y="140">Задачи</text>
    <text x="24" y="176">Контакты</text>
    <text x="24" y="212">Настройки</text>
  </g>
  <g fill="#232830">
    <rect x="0" y="118" width="420" height="1"/><rect x="0" y="154" width="420" height="1"/><rect x="0" y="190" width="420" height="1"/>
  </g>
  <!-- on -->
  <g>
    <rect x="178" y="92" width="24" height="16" rx="8" fill="#2A52C4"/><circle cx="194" cy="100" r="5.5" fill="#FFFFFF"/>
    <rect x="252" y="92" width="24" height="16" rx="8" fill="#2A52C4"/><circle cx="268" cy="100" r="5.5" fill="#FFFFFF"/>
    <rect x="178" y="128" width="24" height="16" rx="8" fill="#2A52C4"/><circle cx="194" cy="136" r="5.5" fill="#FFFFFF"/>
    <rect x="252" y="128" width="24" height="16" rx="8" fill="#2A52C4"/><circle cx="268" cy="136" r="5.5" fill="#FFFFFF"/>
    <rect x="332" y="128" width="24" height="16" rx="8" fill="#2A52C4"/><circle cx="348" cy="136" r="5.5" fill="#FFFFFF"/>
    <rect x="178" y="164" width="24" height="16" rx="8" fill="#2A52C4"/><circle cx="194" cy="172" r="5.5" fill="#FFFFFF"/>
  </g>
  <!-- off -->
  <g>
    <rect x="332" y="92" width="24" height="16" rx="8" fill="#373D48"/><circle cx="340" cy="100" r="5.5" fill="#979EAA"/>
    <rect x="252" y="164" width="24" height="16" rx="8" fill="#373D48"/><circle cx="260" cy="172" r="5.5" fill="#979EAA"/>
    <rect x="332" y="164" width="24" height="16" rx="8" fill="#373D48"/><circle cx="340" cy="172" r="5.5" fill="#979EAA"/>
    <rect x="178" y="200" width="24" height="16" rx="8" fill="#373D48"/><circle cx="186" cy="208" r="5.5" fill="#979EAA"/>
    <rect x="252" y="200" width="24" height="16" rx="8" fill="#373D48"/><circle cx="260" cy="208" r="5.5" fill="#979EAA"/>
    <rect x="332" y="200" width="24" height="16" rx="8" fill="#373D48"/><circle cx="340" cy="208" r="5.5" fill="#979EAA"/>
  </g>
  <!-- shield badge -->
  <g transform="translate(386 212)">
    <circle cx="20" cy="21" r="27" fill="#12151B" stroke="#2A52C4" stroke-opacity="0.5"/>
    <path d="M20 2 L35 8 V20 C35 30 28 36 20 39 C12 36 5 30 5 20 V8 Z" fill="#2A52C4"/>
    <path d="M13.5 20.5 l4.5 4.5 l8.5 -9" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
