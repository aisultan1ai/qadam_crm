<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" fill="none" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif">
  <!-- Qadam hero scene: schematic product UI, no invented data. Palette: Graphite & Cobalt. -->
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0D0F13" flood-opacity="0.16"/>
    </filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0D0F13" flood-opacity="0.14"/>
    </filter>
    <clipPath id="win"><rect x="40" y="56" width="500" height="372" rx="12"/></clipPath>
  </defs>

  <!-- step tiles behind the window (the logo motif) -->
  <rect x="404" y="18" width="150" height="112" rx="16" fill="#DEE7FD"/>
  <rect x="470" y="96" width="150" height="112" rx="16" fill="#BFD0FA"/>
  <rect x="0" y="352" width="132" height="100" rx="16" fill="#EFF3FE"/>

  <!-- app window -->
  <g filter="url(#sh)">
    <rect x="40" y="56" width="500" height="372" rx="12" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#win)">
    <rect x="40" y="56" width="500" height="30" fill="#F6F7F9"/>
    <circle cx="58" cy="71" r="4" fill="#CBD0D8"/><circle cx="72" cy="71" r="4" fill="#CBD0D8"/><circle cx="86" cy="71" r="4" fill="#CBD0D8"/>
    <rect x="40" y="85" width="500" height="1" fill="#E1E4E9"/>

    <!-- sidebar -->
    <rect x="40" y="86" width="116" height="342" fill="#12151B"/>
    <rect x="54" y="100" width="16" height="16" rx="4" fill="#2A52C4"/>
    <rect x="76" y="105" width="50" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.55"/>
    <rect x="40" y="128" width="116" height="1" fill="#232830"/>
    <g fill="#FFFFFF" fill-opacity="0.18">
      <rect x="56" y="146" width="10" height="10" rx="2"/><rect x="74" y="148" width="54" height="6" rx="3"/>
      <rect x="56" y="170" width="10" height="10" rx="2"/><rect x="74" y="172" width="44" height="6" rx="3"/>
      <rect x="56" y="236" width="10" height="10" rx="2"/><rect x="74" y="238" width="48" height="6" rx="3"/>
      <rect x="56" y="260" width="10" height="10" rx="2"/><rect x="74" y="262" width="38" height="6" rx="3"/>
      <rect x="56" y="284" width="10" height="10" rx="2"/><rect x="74" y="286" width="52" height="6" rx="3"/>
    </g>
    <rect x="48" y="188" width="100" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="40" y="194" width="3" height="14" rx="1.5" fill="#6488EA"/>
    <rect x="56" y="196" width="10" height="10" rx="2" fill="#FFFFFF"/>
    <rect x="74" y="198" width="46" height="6" rx="3" fill="#FFFFFF"/>
    <text x="56" y="228" font-size="7" font-weight="600" letter-spacing="0.8" fill="#979EAA">CRM</text>

    <!-- header -->
    <rect x="156" y="86" width="384" height="40" fill="#FFFFFF"/>
    <rect x="156" y="125" width="384" height="1" fill="#E1E4E9"/>
    <rect x="172" y="100" width="130" height="12" rx="6" fill="#F6F7F9" stroke="#E1E4E9"/>
    <rect x="476" y="98" width="48" height="16" rx="4" fill="#2A52C4"/>
    <rect x="486" y="104" width="28" height="4" rx="2" fill="#FFFFFF"/>

    <!-- board -->
    <rect x="156" y="126" width="384" height="302" fill="#F6F7F9"/>
    <text x="172" y="148" font-size="12" font-weight="600" fill="#171A20">Задачи</text>

    <!-- column: Новая -->
    <circle cx="176" cy="166" r="3" fill="#6366F1"/>
    <text x="184" y="169" font-size="8.5" font-weight="500" fill="#4C5462">Новая</text>
    <g>
      <rect x="170" y="176" width="112" height="64" rx="6" fill="#FFFFFF" stroke="#E1E4E9"/>
      <rect x="180" y="187" width="80" height="5" rx="2.5" fill="#373D48"/>
      <rect x="180" y="198" width="56" height="5" rx="2.5" fill="#CBD0D8"/>
      <rect x="180" y="220" width="30" height="10" rx="3" fill="#FFF1F2" stroke="#FECDD3"/>
      <circle cx="266" cy="225" r="6" fill="#0369A1"/>
    </g>
    <g>
      <rect x="170" y="248" width="112" height="54" rx="6" fill="#FFFFFF" stroke="#E1E4E9"/>
      <rect x="180" y="259" width="70" height="5" rx="2.5" fill="#373D48"/>
      <rect x="180" y="282" width="30" height="10" rx="3" fill="#F0F9FF" stroke="#BAE6FD"/>
      <circle cx="266" cy="287" r="6" fill="#B45309"/>
    </g>

    <!-- column: В работе -->
    <circle cx="302" cy="166" r="3" fill="#0EA5E9"/>
    <text x="310" y="169" font-size="8.5" font-weight="500" fill="#4C5462">В работе</text>
    <g>
      <rect x="296" y="176" width="112" height="76" rx="6" fill="#FFFFFF" stroke="#3F68DD" stroke-width="1.5"/>
      <rect x="306" y="187" width="84" height="5" rx="2.5" fill="#373D48"/>
      <rect x="306" y="198" width="60" height="5" rx="2.5" fill="#CBD0D8"/>
      <rect x="306" y="212" width="88" height="4" rx="2" fill="#EEF0F3"/>
      <rect x="306" y="212" width="52" height="4" rx="2" fill="#2A52C4"/>
      <rect x="306" y="232" width="30" height="10" rx="3" fill="#FFFBEB" stroke="#FDE68A"/>
      <circle cx="384" cy="237" r="6" fill="#047857"/>
      <circle cx="394" cy="237" r="6" fill="#A21CAF" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>
    <g>
      <rect x="296" y="260" width="112" height="54" rx="6" fill="#FFFFFF" stroke="#E1E4E9"/>
      <rect x="306" y="271" width="64" height="5" rx="2.5" fill="#373D48"/>
      <rect x="306" y="294" width="30" height="10" rx="3" fill="#F0F9FF" stroke="#BAE6FD"/>
      <circle cx="392" cy="299" r="6" fill="#4338CA"/>
    </g>

    <!-- column: Готово -->
    <circle cx="428" cy="166" r="3" fill="#10B981"/>
    <text x="436" y="169" font-size="8.5" font-weight="500" fill="#4C5462">Готово</text>
    <g>
      <rect x="422" y="176" width="112" height="54" rx="6" fill="#FFFFFF" stroke="#E1E4E9"/>
      <rect x="432" y="187" width="76" height="5" rx="2.5" fill="#979EAA"/>
      <path d="M433 212 l4 4 l8 -8" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="450" y="208" width="40" height="5" rx="2.5" fill="#CBD0D8"/>
    </g>
    <g>
      <rect x="422" y="238" width="112" height="54" rx="6" fill="#FFFFFF" stroke="#E1E4E9"/>
      <rect x="432" y="249" width="60" height="5" rx="2.5" fill="#979EAA"/>
      <path d="M433 274 l4 4 l8 -8" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="450" y="270" width="52" height="5" rx="2.5" fill="#CBD0D8"/>
    </g>
  </g>
  <rect x="40.5" y="56.5" width="499" height="371" rx="11.5" stroke="#CBD0D8"/>

  <!-- floating: deal card -->
  <g filter="url(#sh2)">
    <rect x="456" y="150" width="176" height="104" rx="10" fill="#FFFFFF"/>
  </g>
  <rect x="456.5" y="150.5" width="175" height="103" rx="9.5" stroke="#E1E4E9"/>
  <rect x="470" y="164" width="26" height="26" rx="6" fill="#EFF3FE"/>
  <rect x="475" y="172" width="16" height="12" rx="2.5" stroke="#2A52C4" stroke-width="1.8"/>
  <path d="M479.5 172 v-2.5 a1.5 1.5 0 0 1 1.5 -1.5 h4 a1.5 1.5 0 0 1 1.5 1.5 V172 M475 177.5 h16" stroke="#2A52C4" stroke-width="1.8"/>
  <text x="504" y="175" font-size="9" fill="#697180">Сделка</text>
  <rect x="504" y="181" width="84" height="6" rx="3" fill="#373D48"/>
  <rect x="470" y="202" width="62" height="16" rx="4" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="477" y="213.5" font-size="8.5" font-weight="500" fill="#B45309">Переговоры</text>
  <g>
    <rect x="470" y="232" width="24" height="6" rx="3" fill="#2A52C4"/>
    <rect x="497" y="232" width="24" height="6" rx="3" fill="#2A52C4"/>
    <rect x="524" y="232" width="24" height="6" rx="3" fill="#2A52C4"/>
    <rect x="551" y="232" width="24" height="6" rx="3" fill="#2A52C4"/>
    <rect x="578" y="232" width="24" height="6" rx="3" fill="#E1E4E9"/>
    <rect x="605" y="232" width="13" height="6" rx="3" fill="#E1E4E9"/>
  </g>

  <!-- floating: open-lines chat -->
  <g filter="url(#sh2)">
    <rect x="8" y="300" width="188" height="118" rx="10" fill="#FFFFFF"/>
  </g>
  <rect x="8.5" y="300.5" width="187" height="117" rx="9.5" stroke="#E1E4E9"/>
  <circle cx="30" cy="322" r="11" fill="#229ED9"/>
  <path d="M24.5 322 l11 -4.6 -2 11 -3.4 -2.6 -1.8 1.8 .3 -3 4.5 -4.1 -5.7 3.4z" fill="#FFFFFF"/>
  <text x="48" y="320" font-size="9" font-weight="600" fill="#171A20">Открытые линии</text>
  <rect x="48" y="325" width="58" height="5" rx="2.5" fill="#CBD0D8"/>
  <rect x="22" y="344" width="112" height="24" rx="8" fill="#F6F7F9"/>
  <rect x="32" y="353" width="78" height="5" rx="2.5" fill="#979EAA"/>
  <rect x="70" y="376" width="112" height="26" rx="8" fill="#2A52C4"/>
  <rect x="80" y="386" width="66" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="150" y="386" width="20" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- floating: notification -->
  <g filter="url(#sh2)">
    <rect x="360" y="410" width="228" height="56" rx="10" fill="#FFFFFF"/>
  </g>
  <rect x="360.5" y="410.5" width="227" height="55" rx="9.5" stroke="#E1E4E9"/>
  <rect x="374" y="424" width="28" height="28" rx="8" fill="#ECFDF5"/>
  <path d="M381 438 l5 5 l9 -10" stroke="#047857" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="412" y="434" font-size="9.5" font-weight="600" fill="#171A20">Задача выполнена</text>
  <rect x="412" y="442" width="116" height="5" rx="2.5" fill="#CBD0D8"/>
  <circle cx="570" cy="424" r="3.5" fill="#2A52C4"/>
</svg>
